[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "itsm-backend"
version = "0.1.0"
description = "Single-tenant ITSM backend — FastAPI + SQLAlchemy + SAP HANA/SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "sap-xssec>=4.1.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "hdbcli>=2.19.0",
    "sqlalchemy-hana>=0.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
