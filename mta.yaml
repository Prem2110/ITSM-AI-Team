_schema-version: '3.1'
ID: itsm
version: 0.1.0
description: IT Service Management — SAP BTP Cloud Foundry

# ── Build ────────────────────────────────────────────────────────────────────
# Run `mbt build` from the project root; then `cf deploy mta_archives/itsm_0.1.0.mtar`
# Requires: Cloud MTA Build Tool (mbt), CF CLI + multiapps plugin

modules:

  # ── Static UI (Vite build → copied into approuter/resources) ─────────────
  - name: itsm-ui
    type: html5
    path: frontend
    build-parameters:
      builder: custom
      commands:
        - npm install --legacy-peer-deps
        - npm run build
      artifacts:
        - dist/**
      supported-platforms: []

  # ── Approuter (entry point — auth gate + static files + API proxy) ─────────
  - name: itsm-approuter
    type: approuter.nodejs
    path: deploy/approuter
    parameters:
      disk-quota: 256M
      memory: 128M
    requires:
      - name: itsm-api-dest
        group: destinations
        properties:
          name: itsm-api
          url: ~{url}
          forwardAuthToken: false
    build-parameters:
      requires:
        - name: itsm-ui
          artifacts:
            - dist/**
          target-path: resources

  # ── Backend (FastAPI + Python buildpack) ──────────────────────────────────
  - name: itsm-api
    type: application
    path: backend
    parameters:
      disk-quota: 512M
      memory: 384M
      buildpack: python_buildpack
      health-check-type: http
      health-check-http-endpoint: /health
      # Internal route only — browser traffic goes through the approuter.
      # Enable no-route + CF network-policy once internal routing is verified:
      #   cf add-network-policy itsm-approuter --destination-app itsm-api --port 8080 --protocol tcp
      # no-route: true
    build-parameters:
      # Exclude local dev secrets and artefacts from the .mtar package
      ignore:
        - ".env"
        - ".env.*"
        - "*.db"
        - "*.db-shm"
        - "*.db-wal"
        - ".venv/"
        - "venv/"
        - "__pycache__/"
        - "*.pyc"
        - "*.pyo"
        - "backend-dev.log"
    properties:
      AUTH_MODE: fake
      TABLE_PREFIX: ITSMAI_
      # Restrict CORS to the approuter URL after first deploy, e.g.:
      # CORS_ORIGINS: '["https://itsm-approuter.cfapps.eu10.hana.ondemand.com"]'
      CORS_ORIGINS: '["*"]'
      # HANA connection
      HANA_ADDRESS: fdddfefe-e600-4b7f-b032-4f8fd05ec060.hna0.prod-us10.hanacloud.ondemand.com
      HANA_PORT: 443
      HANA_USER: AI_USE_CASES_HDI_DB_1_9YUM85CO7FKDBO5H0FRK2Q2VA_RT
      HANA_PASSWORD: Tn2FxjyBoXe6c.xQagv6lizP7SGgqd8ZSg4gmHGakSryuDH5vOAemDRqsr-jovT7Ov2c_oxC.tOHET1BrLuz895OMHYke_WJqlX_xSjA85.N0yjn.X5GZ.uo8L0pXH40
      HANA_SCHEMA: AI_USE_CASES_HDI_DB_1
      HANA_ENCRYPT: true
      HANA_SSL_VALIDATE: false
    provides:
      - name: itsm-api-dest
        properties:
          url: ${default-url}
    hooks:
      - name: itsm-db-migrate
        type: task
        phases:
          - blue-green.application.before-stop.live
          - blue-green.application.before-stop.idle
        parameters:
          name: db-migrate
          command: alembic upgrade head
          memory: 256M
          disk-quota: 512M

# ── Resources ────────────────────────────────────────────────────────────────
# (no managed services — XSUAA removed for initial stabilisation)
resources: []

